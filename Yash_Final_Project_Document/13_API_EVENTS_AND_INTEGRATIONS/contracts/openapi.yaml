components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ts_at
      description: httpOnly, Secure, SameSite=Lax access cookie (15 min). Never readable by remotes (INV-T16).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-ts_rt
      description: httpOnly refresh cookie scoped to Path=/api/v1/auth/refresh (the __Host- prefix cannot be path-scoped, so __Secure- is used);
        rotates on use; reuse revokes the family (BR-T050).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on unsafe methods with cookie auth; server also checks Origin/Sec-Fetch-Site.
    serviceToken:
      type: http
      scheme: bearer
      description: ROLE-SVC client-credentials token, org-scoped, short-lived; never issued to browsers.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: HMAC signature verified against the raw body with timestamp tolerance.
  parameters:
