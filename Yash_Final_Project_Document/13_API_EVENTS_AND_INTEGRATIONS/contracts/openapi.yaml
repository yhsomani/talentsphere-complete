openapi: 3.1.0
info:
  title: TalentSphere API (target design)
  version: 1.0.0-draft
  summary: REST /api/v1 contract for identity, evidence, verification, jobs, applications, billing and privacy (+ file upload, capabilities).
  description: 'Target design contract [TARGET]; not an implementation. Conventions: same-origin cookie auth (httpOnly, __Host- prefixed) with
    CSRF header on unsafe methods; no bearer tokens in browser storage (ADR-T06). Errors are RFC 9457 `application/problem+json`. Lists use opaque
    keyset cursors. Unsafe operations accept `Idempotency-Key`. Concurrency uses strong ETag / `If-Match`. Authorization is server-side per `x-policy-action`
    (INV-T01, INV-T02); response filtering by consent is applied before serialisation (INV-T15). Request schemas are strict (unknown fields rejected);
    response schemas are open so additive evolution is non-breaking (FF-06). Rate-limit classes are defined in API_DESIGN_STANDARDS section 9.'
  license:
    name: Proprietary - design document
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: /api/v1
  description: Same-origin REST/BFF base path
tags:
- name: applications
  description: Applications and hiring pipeline (DOM-10)
- name: billing
  description: Plans, checkout, entitlements, Stripe webhook (DOM-16)
- name: evidence
  description: Evidence ladder, artifacts, credentials (DOM-05)
- name: identity
  description: Identity, sessions, passkeys, capabilities (DOM-01)
- name: jobs
  description: Jobs, templates, saved searches (DOM-09)
- name: platform
  description: File upload pipeline (DOM-24)
- name: policy
  description: Capability set (packages/policy)
- name: privacy
  description: Consent, export, erasure, rights requests (DOM-22)
- name: verification
  description: Work claims, references, authority decisions, disputes (DOM-06)
- name: admin
  description: Addendum operations
- name: matching
  description: Addendum operations
- name: messaging
  description: Addendum operations
- name: notify
  description: Addendum operations
- name: orgs
  description: Addendum operations
- name: profile
  description: Addendum operations
- name: safety
  description: Addendum operations
- name: search
  description: Addendum operations
- name: skills
  description: Addendum operations
x-rate-limit-classes:
  RL-AUTH: credential-sensitive routes
  RL-TOKEN: capability-token routes
  RL-READ: authenticated reads
  RL-WRITE: authenticated writes
  RL-HEAVY: search, AI, export, aggregate
  RL-PUBLIC: anonymous reads
  RL-WEBHOOK: provider webhooks (signature gate)
