          - string
          - 'null'
          maxLength: 500
      required:
      - jobId
      - factors
      description: Factors with uncertainty; no numeric score shown as truth (INV-T19)
    ShortlistPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShortlistEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - direct
          - application
          - outreach
        applicationId:
          type:
          - string
          - 'null'
          format: uuid
        orgId:
          type:
          - string
          - 'null'
          format: uuid
        state:
          type: string
          enum:
          - open
          - closed
          - blocked
        muted:
          type: boolean
        archived:
          type: boolean
        lastMessageAt:
          type:
          - string
          - 'null'
          format: date-time
        unreadCount:
          type: integer
        version:
          type: integer
      required:
      - id
      - kind
      - state
      - muted
      - archived
      - unreadCount
      - version
    ConversationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    ConversationCreate:
      type: object
      properties:
        kind:
          type: string
          enum:
          - application
        applicationId:
          type: string
          format: uuid
        firstMessage:
          type: string
          minLength: 1
          maxLength: 4000
      required:
      - kind
      - applicationId
      - firstMessage
      additionalProperties: false
      description: Application threads only; recruiter outreach to a person without an application goes through first-contact requests (API-13-15)
        and the conversation opens on acceptance
    MessageCreate:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        fileIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 5
      required:
      - body
      additionalProperties: false
    MessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    ReadMarker:
      type: object
      properties:
        upToMessageId:
          type: string
          format: uuid
      required:
      - upToMessageId
      additionalProperties: false
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          maxLength: 500
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        readAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - kind
      - payload
      - createdAt
      description: payload holds ids only
    NotificationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    NotificationPreferences:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
                enum:
                - in_app
                - email
                - push
              category:
                type: string
              enabled:
                type: boolean
              frequency:
                type: string
                enum:
                - immediate
                - daily
                - weekly
              quietHours:
                type:
                - object
                - 'null'
        version:
          type: integer
      required:
      - entries
      - version
    NotificationPreferencesPut:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - channel
            - category
            - enabled
            properties:
              channel:
                type: string
                enum:
                - in_app
                - email
                - push
              category:
                type: string
              enabled:
                type: boolean
              frequency:
                type: string
                enum:
                - immediate
                - daily
                - weekly
              quietHours:
                type:
                - object
                - 'null'
      required:
      - entries
      additionalProperties: false
      description: Security and account mail cannot be disabled
    PushSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        userAgentClass:
          type:
          - string
          - 'null'
          maxLength: 500
      required:
      - id
      - createdAt
      description: Endpoint and keys are never returned
    PushSubscriptionCreate:
      type: object
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 1000
        keys:
          type: object
          required:
          - p256dh
          - auth
          additionalProperties: false
          properties:
            p256dh:
              type: string
            auth:
              type: string
        userAgentClass:
          type: string
          maxLength: 500
      required:
      - endpoint
      - keys
      additionalProperties: false
    ReportCreate:
      type: object
      properties:
        targetType:
          type: string
          enum:
          - job
          - profile
          - evidence
          - message
          - course
          - assessment_question
          - referee_request
        targetId:
          type: string
          format: uuid
        reasonCode:
          type: string
          enum:
          - illegal
          - fraud
          - harassment
          - impersonation
          - spam
          - inaccurate
          - other
        note:
          type: string
          maxLength: 1000
      required:
      - targetType
      - targetId
      - reasonCode
      additionalProperties: false
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        caseId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - createdAt
      description: Reporter sees only an acknowledgement, never the case internals
    ModerationCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          x-state-machine: SM-MODCASE
          enum:
          - open
          - triaged
          - in_review
          - awaiting_info
          - actioned
          - appealed
          - closed
        targetType:
          type: string
          maxLength: 500
        targetId:
          type: string
          format: uuid
        priority:
          type: string
          maxLength: 500
        outcome:
          type:
          - string
          - 'null'
          enum:
          - no_action
          - warned
          - content_removed
          - suspended
          - restored
          - null
        appealOutcome:
          type:
          - string
          - 'null'
          enum:
          - none
          - upheld
          - overturned
          - null
        assignedTo:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type: integer
      required:
      - id
      - state
      - targetType
      - targetId
      - version
    ModerationCasePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModerationCase'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    ModerationDecision:
      type: object
      properties:
        outcome:
          type: string
          enum:
          - no_action
          - warned
          - content_removed
          - suspended
          - restored
        reasonCode:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 4000
      required:
      - outcome
      - reasonCode
      additionalProperties: false
      description: Human actor required (SM-00 U6, INV-T09); suspended needs a second person (SM-MODCASE t5)
    Appeal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type:
          - string
          - 'null'
          format: uuid
        attemptId:
          type:
          - string
          - 'null'
          format: uuid
        state:
          type: string
          enum:
          - open
          - upheld
          - overturned
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - state
      - createdAt
      description: 'State words per SM-00: upheld = the original decision stands, overturned = the appeal succeeded (moderation_appeal)'
    AppealCreate:
      type: object
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - statement
      additionalProperties: false
    SupportGrantCreate:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        reasonCode:
          type: string
          maxLength: 500
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
        caseRef:
          type: string
          maxLength: 500
      required:
      - accountId
      - reasonCode
      - scopes
      - durationMinutes
      additionalProperties: false
      description: Maximum 4 h (BR-T041); requester and approver differ for broader scopes
    SupportGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          x-state-machine: SM-SUPPORTGRANT
          enum:
          - pending_approval
          - active
          - expired
          - revoked
          - rejected
        accountRef:
          type: string
          maxLength: 500
        scopes:
          type: array
          items:
            type: string
            maxLength: 500
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - state
      - accountRef
      - scopes
      - expiresAt
      - createdAt
    SupportGrantPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupportGrant'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    UserSupportSummary:
      type: object
      properties:
        accountRef:
          type: string
          maxLength: 500
        status:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        fields:
          type: object
          additionalProperties: true
      required:
      - accountRef
      - status
      - createdAt
      - fields
      description: Masked fields only; revealing one needs API-20-10 and is audited
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          maxLength: 500
        actorRef:
          type:
          - string
          - 'null'
          maxLength: 500
        subjectRef:
          type:
          - string
          - 'null'
          maxLength: 500
        resourceType:
          type:
          - string
          - 'null'
          maxLength: 500
        outcome:
          type: string
          maxLength: 500
        traceId:
          type:
          - string
          - 'null'
          maxLength: 500
      required:
      - id
      - occurredAt
      - action
      - outcome
      description: People appear only as opaque subject_ref tokens (DB-02 section 4.1)
    AuditEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page
    FeatureFlag:
      type: object
      properties:
        key:
          type: string
          maxLength: 500
        enabled:
          type: boolean
        rollout:
          type: object
          additionalProperties: true
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
      - key
      - enabled
      - version
      - updatedAt
    FeatureFlagList:
      type: object
      properties:
        flags:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlag'
      required:
      - flags
    FeatureFlagPut:
      type: object
      properties:
        enabled:
          type: boolean
        rollout:
          type: object
          additionalProperties: true
      required:
      - enabled
      additionalProperties: false
      description: Flags gate rollout, never a security control (BE-01 section 17)
    OrgVerificationSubmit:
      type: object
      properties:
        domains:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 253
        registryRef:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 1000
      required:
      - domains
      additionalProperties: false
      description: DNS TXT challenge is verified by the system; a reviewer confirms registry data where needed
    OrgVerificationDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - verify
          - reject
          - revoke
        reasonCode:
          type: string
          maxLength: 500
      required:
      - decision
      - reasonCode
      additionalProperties: false
      description: Human actor (SM-00 U6); revoke has the BR-T123 effects in the same transaction
    OrgVerification:
      type: object
      properties:
        orgId:
          type: string
          format: uuid
        state:
          type: string
          x-state-machine: SM-ORG
          enum:
          - unverified
          - pending
          - verified
          - rejected
          - revoked
        domains:
          type: array
          items:
            type: string
            maxLength: 500
        decidedAt:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
      required:
      - orgId
      - state
      - version
    SupportGrantDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
          maxLength: 500
      required:
      - decision
      additionalProperties: false
    ApplicationWithReapply:
      allOf:
      - $ref: '#/components/schemas/Application'
      - type: object
        properties:
          reappliedFrom:
            type:
            - string
            - 'null'
            format: uuid
          withdrawnAt:
            type:
            - string
            - 'null'
            format: date-time
      description: Adds the SM-APPLICATION t12 link fields (REVW-27); supersedes the Application response for new clients. A re-apply inside the
        cooldown returns 409 problem type reapply-cooldown-active
    CredentialWithIssuer:
      allOf:
      - $ref: '#/components/schemas/Credential'
      - type: object
        properties:
          state:
            type: string
            x-state-machine: SM-CREDENTIAL
            enum:
            - issued
            - suspended
            - revoked
            - expired
          issuerClass:
            $ref: '#/components/schemas/IssuerClass'
      description: Adds SM-CREDENTIAL state and issuer_class (replaces issuer_kind) for new clients
    UnsubscribeRequest:
      type: object
      properties:
        category:
          type: string
          maxLength: 500
      additionalProperties: false
      description: Token in the path; one click, no login (RFC 8058)
