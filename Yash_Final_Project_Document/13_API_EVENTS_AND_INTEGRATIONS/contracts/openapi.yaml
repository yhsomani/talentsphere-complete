components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ts_at
      description: httpOnly, Secure, SameSite=Lax access cookie (15 min). Never readable by remotes (INV-T16).
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-ts_rt
      description: httpOnly refresh cookie scoped to Path=/api/v1/auth/refresh (the __Host- prefix cannot be path-scoped, so __Secure-
        is used); rotates on use; reuse revokes the family (BR-T050).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on unsafe methods with cookie auth; server also checks Origin/Sec-Fetch-Site.
    serviceToken:
      type: http
      scheme: bearer
      description: ROLE-SVC client-credentials token, org-scoped, short-lived; never issued to browsers.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: HMAC signature verified against the raw body with timestamp tolerance.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: Opaque cursor from `page.nextCursor`. Invalid or expired cursors return 400 malformed-request.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 64
      description: Client-generated unique key (UUID recommended). Same key + same request returns the stored response; same key + different
        request returns 422 idempotency-key-reuse; concurrent duplicate returns 409 idempotency-in-flight.
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
      description: Required for this operation (money, legal or irreversible effect). Absent key returns 428.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Strong ETag from the last read. Missing -> 428; stale -> 412 with current ETag.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: Strong validator for the representation (embeds aggregate version).
      schema:
        type: string
    Location:
      description: URL of the created resource or redirect target.
      schema:
        type: string
    RetryAfter:
      description: Seconds (or HTTP-date) after which to retry.
      schema:
        type: string
    RateLimit:
      description: 'IETF RateLimit header: remaining quota and reset.'
      schema:
        type: string
    IdempotencyReplayed:
      description: true when the response is a replay of the stored result.
      schema:
        type: boolean
  schemas:
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Problem type URI; see API-STD section 5. Stable, documented.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Human-readable, never contains secrets, stack traces, or other users' data
        instance:
          type: string
          description: Request path
        code:
          type: string
          description: Machine code equal to the problem type slug
        traceId:
          type: string
          description: W3C trace id for support correlation
        retryAfterSeconds:
          type: integer
          minimum: 0
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/ProblemDetails'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: array
            items:
              $ref: '#/components/schemas/FieldError'
    PageInfo:
      type: object
      properties:
        nextCursor:
          type: string
        hasMore:
          type: boolean
        limit:
          type: integer
      required:
      - hasMore
      - limit
    FieldError:
      type: object
      properties:
        pointer:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - pointer
      - code
      - message
    ConsentGrantInput:
      description: Sign-up consent. Only account-grain scopes (no grantee, no target) are accepted here; other scopes are rejected with 422 and are granted later via PUT /me/consents/{scope}.
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ConsentScope'
        granted:
          type: boolean
        policyVersion:
          type: string
      required:
      - scope
      - granted
      - policyVersion
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        intendedUse:
          type: string
          enum:
          - candidate
          - employer
          - instructor
          - institution
        termsVersion:
          type: string
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentGrantInput'
          maxItems: 14
        locale:
          type: string
          maxLength: 35
      required:
      - email
