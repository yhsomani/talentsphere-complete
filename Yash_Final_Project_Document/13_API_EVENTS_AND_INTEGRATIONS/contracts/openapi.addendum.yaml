components:
  schemas:
    StepUpChallengeRequest:
      type: object
      properties:
        method:
          type: string
          enum:
          - passkey
          - email_code
      required:
      - method
      additionalProperties: false
      description: Start a step-up (re-authentication) challenge; the result raises recent_auth_at only on success of /auth/step-up/verification
    StepUpChallenge:
      type: object
      properties:
        method:
          type: string
          enum:
          - passkey
          - email_code
        expiresInSeconds:
          type: integer
        options:
          $ref: '#/components/schemas/PasskeyOptions'
      required:
      - method
      - expiresInSeconds
    StepUpVerifyRequest:
      type: object
      properties:
        method:
          type: string
          enum:
          - passkey
          - email_code
        code:
          type: string
          pattern: ^[0-9]{6}$
        assertion:
          $ref: '#/components/schemas/PasskeyAssertion'
      required:
      - method
      additionalProperties: false
    SsoDiscoveryRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      additionalProperties: false
    SsoDiscovery:
      type: object
      properties:
        authorizeUrl:
          type:
          - string
          - 'null'
          maxLength: 500
      required:
      - authorizeUrl
      description: Same shape for every input; authorizeUrl is null unless the email domain is bound to an org with enforced SSO (no
        account enumeration)
    RecoveryRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
      additionalProperties: false
    RecoveryCompletion:
      type: object
      properties:
        token:
          type: string
          maxLength: 500
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
        passkey:
          $ref: '#/components/schemas/PasskeyRegistration'
      required:
      - token
      additionalProperties: false
      description: Exactly one of newPassword or passkey; completing revokes all sessions
    EmailChangeRequest:
      type: object
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 254
      required:
      - newEmail
      additionalProperties: false
    EmailChangeConfirmRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 500
      required:
      - token
      additionalProperties: false
    PasskeyRename:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
      required:
      - label
      additionalProperties: false
    Preferences:
      type: object
      properties:
        theme:
          type: string
          enum:
          - system
          - light
          - dark
        density:
          type: string
          enum:
          - comfortable
          - compact
        locale:
          type: string
          maxLength: 35
        reducedMotion:
          type: boolean
        keyboardShortcuts:
          type: boolean
        version:
          type: integer
      required:
      - theme
      - density
      - locale
      - reducedMotion
      - keyboardShortcuts
      - version
    PreferencesPut:
      type: object
      properties:
        theme:
          type: string
          enum:
          - system
          - light
          - dark
        density:
          type: string
          enum:
          - comfortable
          - compact
        locale:
          type: string
          maxLength: 35
        reducedMotion:
          type: boolean
        keyboardShortcuts:
          type: boolean
      required:
      - theme
      - density
      - locale
      - reducedMotion
      - keyboardShortcuts
      additionalProperties: false
    DeactivationRequest:
      type: object
      properties:
        reasonCode:
          type: string
          enum:
          - break
          - privacy
          - found_job
          - other
      additionalProperties: false
      description: SM-ACCOUNT t5 (active to deactivated); needs recent_auth_at; revokes all sessions
    OwnershipTransferRequest:
      type: object
      properties:
        newOwnerMemberId:
          type: string
          format: uuid
      required:
      - newOwnerMemberId
      additionalProperties: false
    OwnershipTransfer:
      type: object
      properties:
        orgId:
          type: string
          format: uuid
        previousOwnerMemberId:
          type: string
          format: uuid
        newOwnerMemberId:
          type: string
          format: uuid
        transferredAt:
          type: string
          format: date-time
      required:
      - orgId
      - previousOwnerMemberId
      - newOwnerMemberId
      - transferredAt
    ProfileSkillPut:
      type: object
      properties:
        selfRating:
          type: integer
          minimum: 1
          maximum: 5
      additionalProperties: false
    ProfileSkill:
      type: object
      properties:
        skill:
          $ref: '#/components/schemas/SkillRef'
        selfRating:
          type: integer
        addedAt:
          type: string
          format: date-time
        evidenceCount:
          type: integer
      required:
      - skill
      - addedAt
      - evidenceCount
    PortfolioOrderPut:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          uniqueItems: true
      required:
      - itemIds
      additionalProperties: false
    PortfolioOrder:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
      required:
      - itemIds
      - version
    ProfilePreview:
      type: object
      properties:
        viewerKind:
          type: string
          enum:
          - public
          - recruiter_with_consent
          - recruiter_without_consent
        profile:
          type: object
          additionalProperties: true
        omittedSections:
          type: array
          items:
            type: string
            maxLength: 500
      required:
      - viewerKind
      - profile
      - omittedSections
      description: Server-rendered preview of what the chosen viewer would see; masking applied exactly as for a real read (INV-T15)
    IssuerClass:
      type: string
      enum:
      - platform
      - institution
      - employer_org
      - instructor
      description: Mandatory on every authority_verified rung (REV-RES REVW-12). Instructor-issued attestations require instructor !=
        learner and revoke independently; they never count as platform-verified.
    EvidenceIssuer:
      type: object
      properties:
        issuerClass:
          $ref: '#/components/schemas/IssuerClass'
        issuerId:
          type:
          - string
          - 'null'
          format: uuid
        issuerLabel:
          type: string
          maxLength: 500
        issuedAt:
          type: string
          format: date-time
        revokedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - issuerClass
      - issuerLabel
      - issuedAt
      description: Present exactly when rung = authority_verified (null otherwise); shown on every badge
    EvidenceItemWithIssuer:
      allOf:
      - $ref: '#/components/schemas/EvidenceItem'
      - type: object
        properties:
          issuer:
            oneOf:
            - $ref: '#/components/schemas/EvidenceIssuer'
            - type: 'null'
      description: Supersedes the EvidenceItem response shape for new clients (additive field `issuer`); merge into EvidenceItem at
        the next contract revision
    ProvenanceRecord:
      type: object
      properties:
        kind:
          type: string
          enum:
          - self_claim
          - artifact
          - peer_attestation
          - reference
          - employer_email_proof
          - assessment_result
          - course_completion
          - institution_issue
          - instructor_signoff
        issuerClass:
          oneOf:
          - $ref: '#/components/schemas/IssuerClass'
          - type: 'null'
        issuerLabel:
          type:
          - string
          - 'null'
          maxLength: 500
        recordedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - valid
          - revoked
          - expired
      required:
      - kind
      - recordedAt
      - status
    EvidenceProvenance:
      type: object
      properties:
        evidenceId:
          type: string
          format: uuid
        rung:
          type: string
          enum:
          - claimed
          - artifact_backed
          - peer_attested
          - authority_verified
        issuer:
          oneOf:
          - $ref: '#/components/schemas/EvidenceIssuer'
          - type: 'null'
        records:
          type: array
          items:
            $ref: '#/components/schemas/ProvenanceRecord'
      required:
      - evidenceId
      - rung
      - records
    DisputeResponseCreate:
      type: object
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 2000
        evidenceIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
      required:
      - statement
      additionalProperties: false
    DisputeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        disputeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - disputeId
      - createdAt
    RefereeReportCreate:
      type: object
      properties:
        reasonCode:
          type: string
          enum:
          - misuse
          - not_me
          - abuse
          - other
        note:
          type: string
          maxLength: 500
      required:
      - reasonCode
      additionalProperties: false
    RefereeReportReceipt:
      type: object
      properties:
        received:
          type: boolean
      required:
      - received
    RefereeLinkRequest:
      type: object
      properties: {}
      additionalProperties: false
      description: Empty body; the response is identical whether or not the token existed
    AcceptedReceipt:
      type: object
      properties:
        accepted:
          type: boolean
      required:
      - accepted
      description: Uniform 202 body for enumeration-safe routes
    SavedSearchUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 500
        alertFrequency:
          type: string
          enum:
          - 'off'
          - daily
          - weekly
      additionalProperties: false
    HiddenJob:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        hiddenAt:
          type: string
          format: date-time
      required:
      - jobId
      - hiddenAt
    FollowedOrg:
      type: object
      properties:
        orgId:
          type: string
          format: uuid
        followedAt:
          type: string
          format: date-time
      required:
      - orgId
      - followedAt
    JobPauseRequest:
      type: object
      properties:
        reasonCode:
          type: string
          enum:
          - on_hold
          - budget
          - other
      additionalProperties: false
      description: SM-JOB t7 published to paused; hides from search; applications continue
    JobSchedulePut:
      type: object
      properties:
        publishAt:
          type: string
          format: date-time
      required:
      - publishAt
      additionalProperties: false
      description: SM-JOB t5; publishAt must be in the future and within 30 days
    JobReviewDecision:
      type: object
      properties:
        decision:
          type: string
          enum:
          - approve
          - request_changes
        reasonCode:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 4000
      required:
      - decision
      additionalProperties: false
      description: SM-JOB t3 / t4; approver may not be the author when org policy demands (H actor)
    JobCloneRequest:
      type: object
      properties:
        titleSuffix:
          type: string
          maxLength: 40
      additionalProperties: false
      description: Creates a new draft with cloned_from; the source job is untouched
    InterviewSlotSelection:
      type: object
      properties:
        slotId:
          type: string
