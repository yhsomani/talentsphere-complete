name: CI

# docs/quality/TESTING.md §6: CI is a hard release gate. Every step below maps
# to a documented requirement rather than to what happens to pass locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Verify (lint, types, tests, build, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ADR-015: the core loop persists to PostgreSQL, so CI proves it against a
    # real one. Without this service the only tests of durability would be
    # tests that cannot fail.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # TESTING.md §1: code style is enforced, not advisory.
      - name: Lint (Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs unit, integration and the API security suite together.
      - name: Unit, integration and security tests
        run: pnpm test

      # Every migration applies cleanly to an empty database, and re-running
      # the runner is a no-op (idempotent ledger).
      - name: Migrations on a clean database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentsphere_ci
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs | tee /tmp/second-run.log
          grep -q "Already up to date" /tmp/second-run.log

      # Restart round-trip, race arbitration, BR-15 and erasure on real PG.
      - name: Persistence tests (real PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:pg

      - name: Build
        run: pnpm build

      # Playwright boots the API and the built web app itself (webServer).
      # Retries stay at 0: per TESTING.md a flaky test is a defect, not
      # something to paper over with a retry.
      - name: End-to-end, accessibility and performance
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: test-results/performance/
          retention-days: 30
