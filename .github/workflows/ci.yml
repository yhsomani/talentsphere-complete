name: CI

# docs/quality/TESTING.md §6: CI is a hard release gate. Every step below maps
# to a documented requirement rather than to what happens to pass locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Verify (lint, types, tests, build, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ADR-015: the core loop persists to PostgreSQL, so CI proves it against a
    # real one. Without this service the only tests of durability would be
    # tests that cannot fail.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Temporary branch-only formatting diagnostics; remove before review.
      - name: Emit exact Prettier output for bookmark patch
        run: |
          pnpm exec prettier --write apps/api/src/storage/index.ts tests/pg/saved-jobs.test.ts
          echo "BEGIN_BOOKMARK_STORE_INDEX"
          base64 -w 76 apps/api/src/storage/index.ts
          echo "END_BOOKMARK_STORE_INDEX"
          echo "BEGIN_BOOKMARK_TEST"
          base64 -w 76 tests/pg/saved-jobs.test.ts
          echo "END_BOOKMARK_TEST"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # TESTING.md §1: code style is enforced, not advisory.
      - name: Lint (Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs unit, integration and the API security suite together.
      - name: Unit, integration and security tests
        run: pnpm test

      # Every migration applies cleanly to an empty database, and re-running
      # the runner is a no-op (idempotent ledger).
      - name: Verify migration history guard
        run: node --test scripts/tests/migration-integrity.test.mjs

      - name: Migrations on a clean database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentsphere_ci
        run: |
          node scripts/migrate.mjs
          node scripts/migrate.mjs | tee /tmp/second-run.log
          grep -q "Already up to date" /tmp/second-run.log

      # Restart round-trip, race arbitration, BR-15 and erasure on real PG.
      - name: Verify schema and migration ledger after upgrade
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/talentsphere_ci
        run: node scripts/release-preflight.mjs --mode=schema

      - name: Persistence tests (real PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm test:pg

      # Synthetic values only: verify server-side configuration cannot appear
      # in the shipped Vite bundle. Do not inject real CI secrets into builds.
      - name: Build and scan browser bundle for server-only values
        env:
          TOKEN_SECRET: ci-only-session-signing-sentinel-8a70c1b6a67f
          DATABASE_URL: postgresql://ci-sentinel:dummy@localhost:5432/ci_build
          SUPABASE_SERVICE_ROLE_KEY: ci-only-supabase-service-role-sentinel-52cb9d8a
          API_AUTH_TOKEN: ci-only-api-auth-token-sentinel-974e15b3
          BILLING_WEBHOOK_SECRET: ci-only-billing-webhook-sentinel-731ae08d
        run: |
          pnpm build
          node scripts/check-client-secrets.mjs

      # Playwright boots the API and the built web app itself (webServer).
      # Retries stay at 0: per TESTING.md a flaky test is a defect, not
      # something to paper over with a retry.
      - name: End-to-end, accessibility and performance
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: test-results/performance/
          retention-days: 30
