name: Oracle staging config
on:
  pull_request:
    paths:
      - 'deploy/oracle/**'
      - '.dockerignore'
      - '.github/workflows/oracle-staging.yml'
  workflow_dispatch:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model with synthetic configuration
        env:
          SITE_DOMAIN: staging.example.test
          ACME_EMAIL: ci@example.test
          POSTGRES_PASSWORD: ci-synthetic-only-not-a-secret
          TOKEN_SECRET: ci-synthetic-session-secret-at-least-32-chars
        run: |
          docker compose -f deploy/oracle/compose.yaml config --quiet
          # Ensure the database is never published on the host.
          if docker compose -f deploy/oracle/compose.yaml config --format json | jq -e '.services.db.ports // [] | length > 0'; then
            echo 'PostgreSQL must not publish any host ports' >&2
            exit 1
          fi
          # Fail if an accidental API host port is added.
          if docker compose -f deploy/oracle/compose.yaml config --format json | jq -e '.services.api.ports // [] | length > 0'; then
            echo 'API must only be exposed through Caddy' >&2
            exit 1
          fi
