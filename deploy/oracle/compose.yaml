name: talentsphere-staging
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentsphere
      POSTGRES_USER: talentsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentsphere -d talentsphere"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: staging
      PORT: "4000"
      HOST: "0.0.0.0"
      STORAGE: pg
      DATABASE_URL: postgresql://talentsphere:${POSTGRES_PASSWORD:?Required}@db:5432/talentsphere
      TOKEN_SECRET: ${TOKEN_SECRET:?Required}
      TRUST_PROXY: "1"
      APP_URL: https://${SITE_DOMAIN:?Required}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Required}
      BILLING_MODE: disabled
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, egress]

  worker:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: staging
      STORAGE: pg
      DATABASE_URL: postgresql://talentsphere:${POSTGRES_PASSWORD:?Required}@db:5432/talentsphere
      APP_URL: https://${SITE_DOMAIN:?Required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, egress]

  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Required}
      ACME_EMAIL: ${ACME_EMAIL:?Required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [internal, public]

networks:
  public: {}
  egress: {}
  internal:
    internal: true

volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}
