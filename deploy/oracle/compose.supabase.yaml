# Oracle VPS + managed Supabase PostgreSQL (Mumbai only)
# Use this standalone file instead of compose.yaml when using the new database.
name: talentsphere-supabase-staging
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: staging
      PORT: "4000"
      HOST: "0.0.0.0"
      STORAGE: pg
      DATABASE_URL: ${DATABASE_URL:?Required server-only Supabase Postgres connection string}
      SUPABASE_PROJECT_REF: qidckctwrkxyiwworchd
      TOKEN_SECRET: ${TOKEN_SECRET:?Required}
      TRUST_PROXY: "1"
      APP_URL: https://${SITE_DOMAIN:?Required}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Required}
      BILLING_MODE: disabled
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    networks: [private, outbound]
  worker:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: staging
      STORAGE: pg
      DATABASE_URL: ${DATABASE_URL:?Required server-only Supabase Postgres connection string}
      SUPABASE_PROJECT_REF: qidckctwrkxyiwworchd
      APP_URL: https://${SITE_DOMAIN:?Required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    networks: [private, outbound]
  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Required}
      ACME_EMAIL: ${ACME_EMAIL:?Required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private, public]
networks:
  private:
    internal: true
  outbound: {}
  public: {}
volumes:
  caddy_data: {}
  caddy_config: {}
