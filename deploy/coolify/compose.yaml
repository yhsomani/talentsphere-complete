# Coolify variant of deploy/oracle/compose.yaml. Same images and Dockerfile.
# Differences: no host ports and no Caddy TLS (Coolify's Traefik terminates TLS),
# and TRUST_PROXY is 2 because the chain is Traefik -> Caddy -> api.
# In Coolify: Docker Compose build pack, compose path deploy/coolify/compose.yaml,
# then set the domain on the `web` service (port 80).
name: talentsphere-staging
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: talentsphere
      POSTGRES_USER: talentsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentsphere -d talentsphere"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: staging
      PORT: "4000"
      HOST: "0.0.0.0"
      STORAGE: pg
      DATABASE_URL: postgresql://talentsphere:${POSTGRES_PASSWORD:?Required}@db:5432/talentsphere
      TOKEN_SECRET: ${TOKEN_SECRET:?Required}
      TRUST_PROXY: "2"
      APP_URL: https://${SITE_DOMAIN:?Required}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Required}
      BILLING_MODE: disabled
      # Email is off (EMAIL_PROVIDER defaults to none). Brevo needs BREVO_API_KEY and
      # EMAIL_FROM set to real values; empty strings fail env validation at boot.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, egress]

  worker:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: worker
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: staging
      STORAGE: pg
      DATABASE_URL: postgresql://talentsphere:${POSTGRES_PASSWORD:?Required}@db:5432/talentsphere
      APP_URL: https://${SITE_DOMAIN:?Required}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, egress]

  web:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
      target: web
    restart: unless-stopped
    volumes:
      # Overrides the oracle Caddyfile baked into the image.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    # internal: true has no gateway; a second network keeps Traefik able to reach web.
    networks: [internal, public]

networks:
  public: {}
  egress: {}
  internal:
    internal: true

volumes:
  db_data: {}
